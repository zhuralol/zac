# ZAC — Zhura's Asset Classifier — configuration
#
# List the collections that contain your art assets (including free ones).
# Run `python -m zac collections` to see names and ids, then put them here:
collections = []

# Which itch.io classifications count as assets. "assets" is the standard value.
# Games, tools and soundtracks are always excluded.
classifications = ["assets"]

[paths]
downloads = "downloads"
cards = "assets/cards"
cache = ".cache"
keys = "keys.json"
matches = "assets/matches.json"
assets_md = "ASSETS.md"
attribution_md = "ATTRIBUTION.md"

[vision]
# Used by `python -m zac describe`. Provider "openai" works with any
# OpenAI-compatible /chat/completions endpoint; "ollama" uses a local model.
# provider = "openai"
# model = "gpt-4o-mini"
# base_url = "https://api.openai.com/v1"
